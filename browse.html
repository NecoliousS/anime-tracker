<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse - Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <nav class="navbar">
        <div class="nav-brand">Tracker</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="anime.html">Anime</a>
            <a href="manga.html">Manga</a>
            <a href="tv.html">TV Shows</a>
            <a href="movies.html">Movies</a>
            <a href="browse.html" class="active">Browse</a>
        </div>
    </nav>

    <main class="container">
        <h1>Browse</h1>

        <div class="search-type-toggle">
            <button class="toggle-btn active" id="search-anime">Anime</button>
            <button class="toggle-btn" id="search-manga">Manga</button>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search for anime or manga...">
            <button id="search-btn" class="btn btn-primary">Search</button>
        </div>

        <div id="search-results" class="list-grid"></div>

        <div id="loading" class="loading hidden">Loading...</div>
        <div id="no-results" class="empty-state hidden">No results found.</div>
    </main>

    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
